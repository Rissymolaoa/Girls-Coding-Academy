<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Girls Coding Academy - Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #fdfdf6; /* Cream white */
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: #f5f5dc; /* Soft cream */
    color: #333;
    padding: 15px;
    text-align: center;
    border-bottom: 1px solid #ddd;
  }

  .main-container {
    display: flex;
    max-width: 700px;
    margin: 40px auto;
    background: #fffef9; /* Subtle cream */
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  /* Left pane: roles */
  .left-pane {
    width: 45%;
    background: #f8f5e9; /* Lighter cream */
    color: #333;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px 20px;
    padding: 20px;
    justify-items: center;
    align-items: center;
  }

  .role-box {
    background: #fdfdf6; 
    border: 1px solid #ddd;
    padding: 20px;
    width: 100%;
    text-align: center;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.3s, transform 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .role-box:hover {
    background: #f5f5dc;
    transform: translateY(-3px);
  }

  .role-box.active {
    background: #e0dfd5;
    border-color: #bbb;
  }

  .role-box i {
    font-size: 28px;
    margin-bottom: 10px;
  }

  /* Right pane: form */
  .right-pane {
    width: 55%;
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .right-pane h2 {
    color: #555;
    text-align: center;
    margin-bottom: 20px;
  }

  form {
    display: grid;
    gap: 15px;
  }

  label {
    font-weight: bold;
    color: #444;
  }

  input {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: 100%;
  }

  button {
    background: #d6cfc4; /* Cream button */
    color: #333;
    border: none;
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
  }

  button:hover {
    background: #c9c2b9;
  }

  .link {
    text-align: center;
    margin-top: 10px;
  }

  .link a {
    color: #444;
    text-decoration: none;
    font-weight: bold;
  }

  .link a:hover {
    text-decoration: underline;
  }

  /* Track application link */
  .track-link {
    text-align: center;
    margin-top: 12px;
  }
  .track-link a {
    color: #555;
    text-decoration: none;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .track-link a:hover {
    color: #000;
  }

  footer {
    background: #f5f5dc;
    color: #333;
    text-align: center;
    padding: 10px;
    margin-top: auto;
    border-top: 1px solid #ddd;
  }

  /* Modal styles */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
  }
  .modal-content {
    background: #fffef9;
    margin: 20% auto;
    padding: 20px;
    width: 300px;
    text-align: center;
    border-radius: 10px;
    position: relative;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  .close {
    position: absolute;
    right: 15px;
    top: 10px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    color: #aaa;
  }
  .close:hover { color: #000; }
  .modal-icon {
    font-size: 40px;
    color: #e74c3c;
    margin-bottom: 10px;
  }
  .modal-text { font-size: 16px; }

  @media(max-width: 750px){
    .main-container {
      flex-direction: column;
      width: 90%;
    }
    .left-pane, .right-pane { width: 100%; }
    .left-pane { grid-template-columns: repeat(4, 1fr); padding: 15px; }
  }
</style>
</head>
<body>

<header>
  <h1>Girls Coding Academy</h1>
</header>

<div class="main-container">
  <!-- Left: Roles -->
  <div class="left-pane">
    <div class="role-box" data-role="admin"><i class="fas fa-user-shield"></i>Admin</div>
    <div class="role-box" data-role="student"><i class="fas fa-user-graduate"></i>Student</div>
    <div class="role-box" data-role="teacher"><i class="fas fa-chalkboard-teacher"></i>Teacher</div>
    <div class="role-box" data-role="parent"><i class="fas fa-user"></i>Parent</div>
  </div>

  <!-- Right: Form -->
  <div class="right-pane">
    <h2 id="form-title">Select Role to Login</h2>
    <form action="login.php" method="POST" id="login-form">
      <input type="hidden" name="role" id="role-input" value="">
      <label>Email</label>
      <input type="text" name="username" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit" name="login">Login</button>
    </form>
    <div class="link">
      <p>Don't have an account? <a href="registration.html">Register here</a></p>
    </div>
    <!-- Track application link -->
    <div class="track-link">
      <a href="track_application.php"><i class="fas fa-search"></i> Track Your Application</a>
    </div>
  </div>
</div>

<footer>
  &copy; 2025 Girls Coding Academy. All rights reserved.
</footer>

<!-- Modal for errors -->
<div id="errorModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div class="modal-icon"><i class="fas fa-exclamation-triangle"></i></div>
    <div class="modal-text" id="errorText"></div>
  </div>
</div>

<script>
  const roleBoxes = document.querySelectorAll('.role-box');
  const formTitle = document.getElementById('form-title');
  const roleInput = document.getElementById('role-input');

  roleBoxes.forEach(box => {
    box.addEventListener('click', () => {
      roleBoxes.forEach(b => b.classList.remove('active'));
      box.classList.add('active');

      const role = box.getAttribute('data-role');
      roleInput.value = role;
      formTitle.textContent = role.charAt(0).toUpperCase() + role.slice(1) + " Login";
    });
  });

  // Modal logic
  const urlParams = new URLSearchParams(window.location.search);
  const error = urlParams.get('error');
  if(error){
    const modal = document.getElementById("errorModal");
    const errorText = document.getElementById("errorText");
    const span = document.getElementsByClassName("close")[0];

    errorText.textContent = error;
    modal.style.display = "block";

    span.onclick = function(){ modal.style.display = "none"; }
    window.onclick = function(event){
      if(event.target == modal) modal.style.display = "none";
    }
  }
</script>

</body>
</html>
