          <input type="email" id="username" name="username" required>

  <!-- Modal for errors -->
  <div id="errorModal" class="modal">
    <div class="modal-content">
      <button class="close">&times;</button>
      <div class="modal-icon"><i class="fas fa-exclamation-triangle"></i></div>
      <div class="modal-text" id="errorText"></div>
    </div>
  </div>

  <script>
    const roleBoxes = document.querySelectorAll('.role-box');
    const formTitle = document.getElementById('form-title');
    const roleInput = document.getElementById('role-input');

    roleBoxes.forEach(box => {
      box.addEventListener('click', () => {
        roleBoxes.forEach(b => b.classList.remove('active'));
        box.classList.add('active');

        const role = box.getAttribute('data-role');
        roleInput.value = role;
        formTitle.textContent = role.charAt(0).toUpperCase() + role.slice(1) + " Login";
      });
    });

    // Modal logic
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    if (error) {
      const modal = document.getElementById("errorModal");
      const errorText = document.getElementById("errorText");
      const closeBtn = document.querySelector(".close");

      errorText.textContent = decodeURIComponent(error);
      modal.style.display = "block";

      closeBtn.onclick = function() { modal.style.display = "none"; }
      window.onclick = function(event) {
        if (event.target === modal) modal.style.display = "none";
      }
    }
  </script>
